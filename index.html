<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F5D24">
<title>תחרות הרמת משקולות · CrossFit BUX</title>
<style>
/* ============================================================
   CrossFit BUX — תחרות הרמת משקולות אולימפית
   נהלים · מחשבון סינקלייר · הרשמה
   ירוק #1F5D24 · זהב #F1C93B
   ============================================================ */
:root{
  --green:#1F5D24; --green-light:#2f8038; --gold:#F1C93B; --gold-2:#ffe27a; --gold-dim:#c9a52c;
  --bg:#0a110d; --bg2:#0d1712; --card:#1b2822; --card2:#223129;
  --line:#2c4136; --txt:#eef4f0; --muted:#9db3a6;
  --good:#3ecf6b; --bad:#ef4b4b; --white:#f5f7f6;
  --glass:rgba(24,37,30,.66); --glass-brd:rgba(241,201,59,.16); --dot:rgba(255,255,255,.04);
  --radius:18px; --shadow:0 10px 34px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#eaf0ea; --bg2:#dde7df; --card:#ffffff; --card2:#f2f6f3;
    --line:#d3ddd6; --txt:#16211c; --muted:#5b6d63;
    --glass:rgba(255,255,255,.74); --glass-brd:rgba(31,93,36,.14); --dot:rgba(31,93,36,.05);
    --shadow:0 10px 30px rgba(31,93,36,.12); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Heebo","Assistant",Arial,sans-serif;
  background:var(--bg); color:var(--txt); min-height:100vh; line-height:1.5; -webkit-font-smoothing:antialiased;
}
/* שכבות רקע: זוהר ירוק-זהב + רשת נקודות עדינה */
body::before{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(48vw 48vw at 88% -8%, rgba(241,201,59,.16), transparent 60%),
    radial-gradient(52vw 52vw at -12% 8%, rgba(47,128,56,.30), transparent 62%),
    radial-gradient(70vw 60vw at 50% 118%, rgba(31,93,36,.42), transparent 60%),
    linear-gradient(165deg,var(--bg),var(--bg2));
  background-attachment:fixed;
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(var(--dot) 1px, transparent 1.4px);
  background-size:24px 24px;
}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}

header{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,rgba(31,93,36,.97),rgba(20,50,24,.97));
  backdrop-filter:blur(8px); border-bottom:2px solid var(--gold); padding:10px 12px;
}
.brand{display:flex;align-items:center;gap:10px;color:#fff}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--gold-2),var(--gold));
  color:var(--green);display:grid;place-items:center;font-weight:900;font-size:19px;
  box-shadow:0 4px 16px rgba(241,201,59,.45)}
.brand h1{font-size:16px;margin:0;font-weight:800}
.brand .sub{font-size:11px;color:var(--gold);font-weight:700}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.tab{white-space:nowrap;border:none;background:rgba(255,255,255,.08);color:#dfe9e2;
  padding:9px 15px;border-radius:999px;font-size:13px;font-weight:800;cursor:pointer;transition:.15s}
.tab.active{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--green);
  box-shadow:0 4px 16px rgba(241,201,59,.4)}
main{max-width:820px;margin:0 auto;padding:14px 12px 90px}

h2{font-size:20px;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
h3{font-size:15px;margin:14px 0 8px;color:var(--gold);display:flex;align-items:center;gap:8px}
h3::before{content:'';width:4px;height:16px;border-radius:3px;background:linear-gradient(var(--gold-2),var(--gold-dim));flex:0 0 auto}
.card{background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
.card::before{content:'';position:absolute;top:0;inset-inline:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:10px}
.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:560px){.g3{grid-template-columns:1fr 1fr}}
label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);
  color:var(--txt);border-radius:10px;padding:10px;font-size:15px;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.btn{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#1a3d1e;border:none;border-radius:11px;
  padding:11px 16px;font-size:14px;font-weight:800;cursor:pointer;transition:transform .12s,box-shadow .2s;
  text-decoration:none;display:inline-block;box-shadow:0 5px 16px rgba(241,201,59,.28)}
.btn:hover{box-shadow:0 8px 22px rgba(241,201,59,.42)}
.btn:active{transform:scale(.97)}
.btn.g{background:linear-gradient(135deg,var(--green-light),#256b2c);color:#fff;box-shadow:0 5px 16px rgba(47,128,56,.35)}
.btn.big{position:relative;overflow:hidden}
.btn.big::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-18deg);
  animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}80%,100%{left:130%}}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:7px 11px;font-size:12px}
.btn.big{display:block;text-align:center;font-size:18px;padding:16px;border-radius:14px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
.pill.gold{background:var(--gold);color:var(--green)}
.pill.age{background:#26382e;color:var(--gold);margin-inline-start:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:11px;font-weight:800}
.scroll{overflow-x:auto}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
code.copy{display:block;background:var(--card2);border:1px solid var(--line);border-radius:10px;
  padding:10px;font-size:13px;direction:ltr;text-align:left;cursor:pointer;word-break:break-all}
.note{background:rgba(241,201,59,.12);border:1px solid var(--gold);border-radius:12px;padding:12px;margin:10px 0}
.note b{color:var(--gold)}
.learn-card{border-inline-start:4px solid var(--gold)}
.timeline-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.timeline-item .t{flex:0 0 74px;font-weight:900;color:var(--gold);font-size:13px}
.quiz-opt{display:block;width:100%;text-align:right;background:var(--card2);border:1px solid var(--line);
  color:var(--txt);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;font-size:14px;font-weight:600}
.quiz-opt.correct{background:var(--good);color:#04240f;border-color:var(--good)}
.quiz-opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
details{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
summary{font-weight:800;cursor:pointer}
.tag{font-size:10px;background:var(--card2);border:1px solid var(--line);padding:2px 7px;border-radius:6px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);
  color:#fff;padding:12px 20px;border-radius:12px;font-weight:800;z-index:200;box-shadow:var(--shadow);
  border:1px solid var(--gold);max-width:90%;text-align:center;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.hero{background:linear-gradient(140deg,#237029,#0f2c17 72%);border:1px solid var(--glass-brd);
  border-radius:var(--radius);padding:24px 20px;text-align:center;color:#fff;margin-bottom:14px;
  position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::before{content:'';position:absolute;inset:0;
  background:radial-gradient(45% 70% at 100% 0%,rgba(241,201,59,.28),transparent 60%),
             radial-gradient(40% 60% at 0% 100%,rgba(62,207,107,.16),transparent 60%)}
.hero::after{content:'🏋️';position:absolute;font-size:150px;opacity:.06;left:-14px;bottom:-40px;transform:rotate(-12deg)}
.hero>*{position:relative}
.hero .big{font-size:27px;font-weight:900;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.hero .price{display:inline-block;background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--green);
  font-weight:900;font-size:20px;padding:7px 20px;border-radius:999px;margin-top:12px;
  box-shadow:0 6px 18px rgba(241,201,59,.45)}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
const A = window.APP_DATA;

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2000); }
function fmtDate(iso){ const [y,m,d]=iso.split('-'); return `${d}.${m}.${y}`; }
function copyTxt(el){
  const t=el.textContent.trim();
  const done=()=>toast('הקישור הועתק ✓'), fail=()=>toast('לחיצה ארוכה על הקישור כדי להעתיק');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>legacyCopy(t,done,fail));
  } else legacyCopy(t,done,fail);
}
function legacyCopy(t,done,fail){
  try{
    const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0,t.length);
    const ok=document.execCommand('copy'); document.body.removeChild(ta); ok?done():fail();
  }catch(e){ fail(); }
}

/* ============================================================
   סינקלייר (Sinclair) — מחזור 2021–2024
   ============================================================ */
const SINCLAIR = { M:{A:0.722762521,b:193.609}, F:{A:0.787004341,b:153.757} };
function sinclair(sex, bw, total){
  const p=SINCLAIR[sex]; if(!p||!bw||bw<=0) return {coeff:0,score:0};
  const coeff = bw>=p.b ? 1.0 : Math.pow(10, p.A*Math.pow(Math.log10(bw/p.b),2));
  return { coeff, score:(total||0)*coeff };
}
/* קטגוריות משקל — תקן IWF מ-1.6.2025 */
const CATS = { M_senior:[60,65,71,79,88,94,110], F_senior:[48,53,58,63,69,77,86],
               M_youth:[56,60,65,71,79,88,94], F_youth:[44,48,53,58,63,69,77] };
function assignCategory(sex, bw, youth){
  if(!bw) return ''; const arr=CATS[sex+'_'+(youth?'youth':'senior')];
  for(const c of arr){ if(bw<=c) return String(c); } return '+'+arr[arr.length-1];
}
/* קבוצות גיל לפי שנת לידה */
function ageGroups(birthYear){
  if(!birthYear) return []; const age=A.competitionYear-birthYear; const g=[];
  if(age>=13&&age<=17) g.push('נוער (Youth)');
  if(age>=15&&age<=20) g.push('נוער-בוגר (Junior)');
  if(age>=15) g.push('בוגרים (Senior)');
  if(age>=35) g.push('מאסטרס (Masters)');
  return g;
}
function isYouthAge(by){ if(!by) return false; const age=A.competitionYear-by; return age>=13&&age<=17; }

/* ============================================================
   ניווט
   ============================================================ */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  ['reg','learn','calc','staff'].forEach(t=> document.getElementById('tab-'+t).style.display=(t===b.dataset.tab)?'block':'none');
});

/* ============================================================
   טאב הרשמה
   ============================================================ */
function renderReg(){
  const root=document.getElementById('tab-reg');
  root.innerHTML=`
  <div class="hero">
    <div class="big">🏋️ תחרות הרמת משקולות</div>
    <div style="margin-top:6px">יום שישי · <span class="num">${fmtDate(A.competitionDate)}</span> · <span class="num">${A.timeRange}</span></div>
    <div class="price">דמי השתתפות: ${A.priceILS}₪</div>
  </div>

  <div class="card">
    <h2>📝 איך נרשמים?</h2>
    <ol class="muted" style="padding-inline-start:18px;line-height:2">
      <li>ממלאים את <b>טופס ההרשמה</b> (הכפתור למטה).</li>
      <li>בסוף הטופס משלמים <b>${A.priceILS}₪</b> — מועברים אוטומטית לדף התשלום המאובטח.</li>
      <li>ההרשמה סופית ומובטחת רק לאחר התשלום ✅</li>
    </ol>
    <a class="btn big" href="${A.registrationFormUrl}" target="_blank" rel="noopener">📝 למילוי טופס ההרשמה ותשלום ←</a>
    <div class="note"><b>💳 התשלום (${A.priceILS}₪)</b> מתבצע בסוף הטופס — תועברו אוטומטית לדף התשלום.</div>
    <hr>
    <label>קישור ישיר לטופס (להעתקה ושיתוף):</label>
    <code class="copy" onclick="copyTxt(this)">${A.registrationFormUrl}</code>
  </div>

  <div class="card">
    <h3>מה כדאי להביא / להכין לשקילה?</h3>
    <ul class="muted" style="padding-inline-start:18px;line-height:1.9">
      <li>תעודה מזהה.</li>
      <li>לדעת מראש את <b>משקלי הפתיחה</b> המתוכננים בהנפה ובהרחה ודחיקה (אפשר לעדכן ביום התחרות).</li>
      <li>נעלי הרמה, חגורה, מגני ברכיים — אם יש.</li>
      <li>ההגעה לשקילה: כשעתיים לפני תחילת המקצה שלכם.</li>
    </ul>
    <p class="muted">לא בטוחים איך הכול עובד? עברו ללשונית <b>"נהלים וחוקים"</b> ☝️</p>
  </div>`;
}

/* ============================================================
   טאב נהלים וחוקים
   ============================================================ */
function renderLearn(){
  const root=document.getElementById('tab-learn');
  if(root.dataset.built) return; root.dataset.built='1';
  root.innerHTML=`
  <div class="card learn-card"><h2>📖 איך עובדת תחרות הרמת משקולות?</h2>
    <p class="muted">שני תרגילים: <b>הנפה (Snatch)</b> — הרמת המוט מהרצפה לגובה מעל הראש בתנועה אחת רציפה; ו<b>הרחה ודחיקה (Clean &amp; Jerk)</b> — מהרצפה לכתפיים ואז דחיקה מעל הראש. לכל תרגיל <b>3 כניסות (Attempts)</b>. המקצה (Total) = ההנפה הטובה + ההרחה ודחיקה הטובה. המנצח בכל קטגוריה — בעל המקצה הגבוה ביותר.</p>
  </div>

  <div class="card"><h3>🕐 ציר זמן של יום תחרות</h3>
    <div class="timeline-item"><div class="t">שעתיים לפני</div><div><b>שקילה (Weigh-in)</b> נפתחת, נמשכת שעה. שוקלים משקל גוף, נקבעת הקטגוריה ומאשרים כניסות פתיחה.</div></div>
    <div class="timeline-item"><div class="t">חימום</div><div>מתחממים בחדר ההכנה עם המשקלים המתוכננים.</div></div>
    <div class="timeline-item"><div class="t">חלק א׳</div><div><b>הנפה (Snatch)</b> — 3 כניסות לכל מרים, לפי סדר עלייה למוט.</div></div>
    <div class="timeline-item"><div class="t">הפסקה</div><div>10 דקות בין הנפה להרחה ודחיקה.</div></div>
    <div class="timeline-item"><div class="t">חלק ב׳</div><div><b>הרחה ודחיקה (C&J)</b> — שוב 3 כניסות לכל מרים.</div></div>
    <div class="timeline-item"><div class="t">סיום</div><div>חישוב מקצה, דירוגים וטקס מדליות.</div></div>
  </div>

  <div class="card"><h3>📏 החוקים החשובים</h3>
    <details><summary>סדר העלייה למוט (Lifting Order)</summary><p class="muted">המשקל על המוט <b>תמיד עולה, לעולם לא יורד</b>. מי שביקש את המשקל הנמוך ביותר עולה ראשון. שוויון במשקל → מי שבמספר כניסה נמוך יותר. שוויון גם בזה → מספר גורל (Lot) נמוך.</p></details>
    <details><summary>שינויי הצהרה (Changes)</summary><p class="muted">מותר לשנות את המשקל המבוקש עד <b>פעמיים</b> לכל כניסה, כל עוד אינו נמוך מהמשקל שכבר הוכרז על המוט.</p></details>
    <details><summary>טיימר (Clock)</summary><p class="muted"><b>דקה (60 שנ׳)</b> מרגע הקריאה. <b>2 דקות</b> אם אותו מרים עולה שתי כניסות ברצף. התראה ב-30 השניות האחרונות.</p></details>
    <details><summary>מספר גורל (Lot Number)</summary><p class="muted">מוגרל לכל מרים בהרשמה — קובע סדר כשיש שוויון, ואת סדר החימום.</p></details>
    <details><summary>תוספת משקל מינימלית</summary><p class="muted">1 ק"ג. אחרי כניסה מוצלחת חייבים לעלות בלפחות 1 ק"ג. אחרי פסילה אפשר להישאר על אותו משקל.</p></details>
    <details><summary>שובר שוויון (Tie-break)</summary><p class="muted">בשוויון מקצה — מנצח מי שהשיג את המקצה קודם (תקן IWF עדכני). משקל הגוף כבר אינו שובר שוויון.</p></details>
  </div>

  <div class="card"><h3>⚖️ קטגוריות משקל (תקן IWF מ-1.6.2025)</h3>
    <div class="scroll"><table><tbody>

}

const QUIZ=[
  {q:'שני מרימים: א׳ ביקש 80 ק"ג (כניסה 2), ב׳ ביקש 80 ק"ג (כניסה 1). מי עולה ראשון?',
   o:['א׳','ב׳','לפי הגובה'],c:1,e:'שוויון במשקל → מי שבמספר כניסה נמוך יותר. ב׳ בכניסה 1.'},
  {q:'מרים סיים הרמה מעל הראש אבל הוריד את המוט לפני אות השופט. תקין?',
   o:['תקין','פסול (No Lift)'],c:1,e:'חובה להמתין נייח לאות ההורדה (Down Signal).'},
  {q:'המשקל על המוט כרגע 100 ק"ג. מרים מבקש כניסה של 98 ק"ג. אפשרי?',
   o:['כן','לא — המשקל רק עולה'],c:1,e:'המשקל על המוט לעולם לא יורד.'},
  {q:'מרים נעל את המוט מעל הראש, ואז המרפקים כופפו ויושרו שוב. מה זה?',
   o:['הרמה תקינה','Press-out — פסול'],c:1,e:'לחיצה בהמשך התנועה פוסלת את ההרמה.'},
  {q:'כמה שינויי הצהרה מותרים לכל כניסה?',
   o:['1','2','ללא הגבלה'],c:1,e:'עד 2 שינויים, ולא מתחת למשקל שהוכרז.'},
  {q:'מרים נכשל בכל 3 כניסות ההנפה. מה קורה למקצה שלו?',
   o:['נחשב לפי ה"ד בלבד','אין מקצה (Bomb-out)'],c:1,e:'בלי הנפה תקינה אין מקצה.'},
  {q:'כמה זמן מקבל מרים מרגע הקריאה (כשלא ברצף)?',
   o:['30 שניות','60 שניות','3 דקות'],c:1,e:'דקה אחת; שתי דקות רק כשעולה פעמיים ברצף.'},
  {q:'מרים במשקל גוף 79.01 ק"ג. לאיזו קטגוריית גברים ישובץ?',
   o:['79','88'],c:1,e:'79.01 גדול מ-79 → משובץ ל-88.'},
  {q:'בזמן ה-Clean המרפק נשען על הברך. תקין?',
   o:['תקין','פסול'],c:1,e:'נגיעת/הישענות מרפק על הברך פוסלת.'},
  {q:'אחרי כניסה מוצלחת, בכמה חייבים להעלות לפחות?',
   o:['0.5 ק"ג','1 ק"ג','5 ק"ג'],c:1,e:'תוספת מינימלית 1 ק"ג.'}
];
let quizI=0, quizScore=0, quizCount=0, quizAnswered=false;
function resetQuiz(){ quizI=0;quizScore=0;quizCount=0;quizAnswered=false; renderQuiz(); }
function nextQuiz(){ quizI=(quizI+1)%QUIZ.length; quizAnswered=false; renderQuiz(); }
function renderQuiz(){
  const box=document.getElementById('quizBox'); if(!box) return; const q=QUIZ[quizI];
  document.getElementById('quizScore').textContent=`${quizScore}/${quizCount}`;
  box.innerHTML=`<div style="font-weight:800;margin-bottom:10px">${q.q}</div>`+
    q.o.map((op,i)=>`<button class="quiz-opt" data-i="${i}" onclick="answerQuiz(${i})">${op}</button>`).join('')+
    `<div id="quizFb" class="muted" style="margin-top:6px"></div>`;
}
function answerQuiz(i){
  if(quizAnswered) return; quizAnswered=true; const q=QUIZ[quizI]; quizCount++;
  document.querySelectorAll('#quizBox .quiz-opt').forEach(b=>{ const bi=+b.dataset.i;
    if(bi===q.c) b.classList.add('correct'); else if(bi===i) b.classList.add('wrong'); });
  if(i===q.c) quizScore++;
  document.getElementById('quizFb').innerHTML=(i===q.c?'✅ נכון! ':'❌ ')+q.e;
  document.getElementById('quizScore').textContent=`${quizScore}/${quizCount}`;
}

function renderCalc(){
  const root=document.getElementById('tab-calc');

  root.innerHTML=`
  <div class="card">
    <h2>🧮 מחשבון סינקלייר (Sinclair)</h2>
    <p class="muted">משווה מרימים במשקלי גוף שונים — כופל את המקצה במקדם לפי משקל הגוף. משמש לדירוג "המרים/ה הטוב/ה ביותר".</p>
    <div class="grid g3">
      <div><label>מין</label><select id="c_sex"><option value="M">גבר</option><option value="F">אישה</option></select></div>

      <div><label>הנפה (Snatch)</label><input id="c_sn" type="number" placeholder='ק"ג'></div>
      <div><label>הרחה ודחיקה (C&J)</label><input id="c_cj" type="number" placeholder='ק"ג'></div>

  <div class="card">
    <h3>⚖️ השוואה בין מרימים (עד 4)</h3>
    <div id="cmpRows"></div>
    <div class="row" style="margin-top:8px"><button class="btn sm g" onclick="addCmp()">➕ הוסף מרים</button><button class="btn sm" onclick="calcCmp()">השווה</button></div>
    <div id="cmpOut" style="margin-top:12px"></div>
  </div>

    <p class="muted" style="margin-top:8px"><b>סינקלייר</b> הוא השיטה הקלאסית ומשמש כאן. מ-2025 ה-IWF עבר רשמית ל-<b>Q-Points</b> לתחרויות בינלאומיות — שיטה שמכוילת מחדש כל שנה. בתחרות מועדונית סינקלייר נפוץ ומספיק.</p>
  </details></div>`;
  addCmp(); addCmp();
}
function calcSinclair(){
  const g=id=>document.getElementById(id);
  const sex=g('c_sex').value, bw=parseFloat(g('c_bw').value), by=parseInt(g('c_by').value)||null;
  let total=parseFloat(g('c_tot').value)||0; const sn=parseFloat(g('c_sn').value)||0, cj=parseFloat(g('c_cj').value)||0;
  if(!total) total=sn+cj;
  if(!bw||!total){ g('calcOut').innerHTML='<div class="muted">נא להזין משקל גוף ומקצה (או הנפה+ה"ד)</div>'; return; }
  const s=sinclair(sex,bw,total); const cat=assignCategory(sex,bw,isYouthAge(by)); const groups=by?ageGroups(by):[];
  g('calcOut').innerHTML=`
    <div class="card" style="background:var(--card2);margin:0">
      <div class="row" style="justify-content:space-between">
        <div><div class="muted">תוצאת סינקלייר</div><div style="font-size:38px;font-weight:900;color:var(--gold)"><span class="num">${s.score.toFixed(3)}</span></div></div>
        <div style="text-align:left"><div class="muted">מקדם · מקצה</div><div class="num" style="font-size:16px">${s.coeff.toFixed(4)} × ${total}</div></div>
      </div><hr>
      <div class="row">${cat?`<span class="pill gold num">קטגוריה ${cat} ק"ג</span>`:''}${groups.map(x=>`<span class="pill age">${x}</span>`).join('')}</div>
    </div>`;
}
let cmpN=0;
function addCmp(){
  if(cmpN>=4){ toast('עד 4 מרימים'); return; } cmpN++;
  const d=document.createElement('div'); d.className='grid g3'; d.style.marginBottom='8px'; d.dataset.cmp='1';
  d.innerHTML=`<div><input placeholder="שם" class="cmp_name"></div>
    <div><select class="cmp_sex"><option value="M">גבר</option><option value="F">אישה</option></select></div>
    <div class="row" style="gap:4px"><input placeholder='משקל' type="number" step="0.01" class="cmp_bw" style="flex:1"><input placeholder='מקצה' type="number" class="cmp_tot" style="flex:1"></div>`;
  document.getElementById('cmpRows').appendChild(d);
}
function calcCmp(){
  const rows=[...document.querySelectorAll('#cmpRows [data-cmp]')];
  const data=rows.map(r=>{ const name=r.querySelector('.cmp_name').value||'—'; const sex=r.querySelector('.cmp_sex').value;
    const bw=parseFloat(r.querySelector('.cmp_bw').value), tot=parseFloat(r.querySelector('.cmp_tot').value);
    if(!bw||!tot) return null; const s=sinclair(sex,bw,tot); return {name,sex,bw,tot,coeff:s.coeff,score:s.score};
  }).filter(Boolean).sort((a,b)=>b.score-a.score);
  if(!data.length){ document.getElementById('cmpOut').innerHTML='<div class="muted">מלא משקל+מקצה לפחות למרים אחד</div>'; return; }
  let t=`<div class="scroll"><table><thead><tr><th>#</th><th>שם</th><th>מין</th><th>משקל</th><th>מקצה</th><th>סינקלייר</th></tr></thead><tbody>`;
  data.forEach((x,i)=>t+=`<tr><td><b>${i+1}</b></td><td style="text-align:right">${x.name}</td><td>${x.sex==='M'?'ז':'נ'}</td><td class="num">${x.bw}</td><td class="num">${x.tot}</td><td><b class="num">${x.score.toFixed(3)}</b></td></tr>`);
  document.getElementById('cmpOut').innerHTML=t+'</tbody></table></div>';
}

      <li><b>מרים הטוב ביותר:</b> מזינים משקל גוף+טוטאל למחשבון הסינקלייר כאן, ורושמים את התוצאה בעמודת "סינקלייר".</li>

function runTests(){
  let pass=0,fail=0; const ok=(c,m)=>{ c?pass++:(fail++,console.error('❌',m)); };
  const near=(a,b,e=0.01)=>Math.abs(a-b)<=e;
  const m=sinclair('M',81,300), w=sinclair('F',63,200);
  ok(m.coeff>1&&m.coeff<1.3,'מקדם גבר 81='+m.coeff.toFixed(4));
  ok(w.coeff>1&&w.coeff<1.6,'מקדם אישה 63='+w.coeff.toFixed(4));
  ok(near(m.score,300*m.coeff),'score M'); ok(near(w.score,200*w.coeff),'score F');
  ok(sinclair('M',200,300).coeff===1.0,'מעל b → 1.0');
  ok(assignCategory('M',79.00,false)==='79','79.00→79');
  ok(assignCategory('M',79.01,false)==='88','79.01→88');
  ok(assignCategory('M',200,false)==='+110','>110→+110');
  ok(assignCategory('F',48.00,false)==='48','48.00→48');
  ok(assignCategory('F',48.01,false)==='53','48.01→53');
  console.log(`%c🏋️ BUX Tests: ${pass} passed, ${fail} failed`,`color:${fail?'#ef4b4b':'#3ecf6b'};font-weight:bold`);
  console.log('סינקלייר: גבר 81/300 =',m.score.toFixed(3),'| אישה 63/200 =',w.score.toFixed(3));
}
runTests();
