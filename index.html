<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F5D24">
<title>תחרות הרמת משקולות · CrossFit BUX</title>
<style>
/* ============================================================
   CrossFit BUX — מערכת ניהול תחרות הרמת משקולות אולימפית
   ירוק #1F5D24 · זהב #F1C93B
   ============================================================ */
:root{
  --green:#1F5D24; --green-light:#2f8038; --gold:#F1C93B; --gold-dim:#c9a52c;
  --bg:#0e1512; --bg2:#16211c; --card:#1b2822; --card2:#223129;
  --line:#2c4136; --txt:#eef4f0; --muted:#9db3a6;
  --good:#3ecf6b; --bad:#ef4b4b; --wait:#7d8f85; --white:#f5f7f6;
  --radius:16px; --shadow:0 8px 28px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#eef2ef; --bg2:#e2e9e4; --card:#ffffff; --card2:#f2f6f3;
    --line:#d3ddd6; --txt:#16211c; --muted:#5b6d63; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Heebo","Assistant",Arial,sans-serif;
  background:linear-gradient(160deg,var(--bg),var(--bg2));
  color:var(--txt); min-height:100vh; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.en{font-family:inherit;direction:ltr;unicode-bidi:isolate;display:inline-block}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}

/* ---------- Header + tabs ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,rgba(31,93,36,.96),rgba(20,50,24,.96));
  backdrop-filter:blur(8px); border-bottom:2px solid var(--gold);
  padding:10px 12px calc(env(safe-area-inset-bottom,0)*0);
}
.brand{display:flex;align-items:center;gap:10px;color:#fff}
.logo{width:38px;height:38px;border-radius:10px;background:var(--gold);color:var(--green);
  display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:var(--shadow)}
.brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--gold);font-weight:700}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.tab{white-space:nowrap;border:none;background:rgba(255,255,255,.08);color:#dfe9e2;
  padding:9px 14px;border-radius:999px;font-size:13px;font-weight:800;cursor:pointer;transition:.15s}
.tab.active{background:var(--gold);color:var(--green)}
main{max-width:1100px;margin:0 auto;padding:14px 12px 90px}

/* ---------- generic ---------- */
h2{font-size:19px;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
h3{font-size:15px;margin:14px 0 8px;color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:560px){.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);
  color:var(--txt);border-radius:10px;padding:10px;font-size:15px;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
button{font-family:inherit}
.btn{background:var(--gold);color:var(--green);border:none;border-radius:10px;padding:11px 16px;
  font-size:14px;font-weight:800;cursor:pointer;transition:.15s;color:#1a3d1e}
.btn:active{transform:scale(.97)}
.btn.g{background:var(--green-light);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:7px 11px;font-size:12px}
.btn.danger{background:#5a2020;color:#ffd7d7}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
.pill.m{background:#1f3a5c;color:#bcd8ff}.pill.f{background:#5c1f4a;color:#ffbce9}
.pill.gold{background:var(--gold);color:var(--green)}
.pill.age{background:#26382e;color:var(--gold);margin-inline-start:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:11px;font-weight:800;position:sticky;top:0}
.scroll{overflow-x:auto}
.att{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;
  font-weight:800;font-size:13px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.att.good{background:var(--good);color:#04240f;border-color:var(--good)}
.att.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.att.cur{outline:3px solid var(--gold);outline-offset:1px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.tag{font-size:10px;background:var(--card2);border:1px solid var(--line);padding:2px 7px;border-radius:6px;color:var(--muted)}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.stepbar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.step{flex:1;min-width:120px;text-align:center;padding:9px;border-radius:10px;background:var(--card);
  border:1px solid var(--line);font-size:12px;font-weight:800;cursor:pointer;color:var(--muted)}
.step.active{background:var(--green);color:#fff;border-color:var(--gold)}
.step b{display:block;font-size:16px;color:var(--gold)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);
  color:#fff;padding:12px 20px;border-radius:12px;font-weight:800;z-index:200;box-shadow:var(--shadow);
  border:1px solid var(--gold);max-width:90%;text-align:center;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- barbell viz ---------- */
.bar-wrap{display:flex;align-items:center;justify-content:center;gap:1px;padding:14px 4px;overflow-x:auto}
.sleeve{width:52px;height:12px;background:#8a8f92;border-radius:2px}
.barcenter{height:10px;flex:0 0 26px;background:#5b6165;min-width:26px}
.plate{border-radius:3px;margin:0 1px;display:grid;place-items:center;font-size:9px;font-weight:900;
  color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5);border:1px solid rgba(0,0,0,.25)}
.collar{width:12px;height:26px;background:#c9ccce;border-radius:3px}

/* ---------- audience / big display ---------- */
.audience{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 20%,#153a1c,#0a1410);
  display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.audience.on{display:flex}
.audience .lift-name{font-size:min(13vw,90px);font-weight:900;color:#fff;line-height:1.05;margin:0}
.audience .lift-sub{font-size:min(5vw,30px);color:var(--gold);font-weight:800;margin-top:6px}
.audience .weight{font-size:min(34vw,260px);font-weight:900;color:var(--gold);line-height:.9;margin:10px 0}
.audience .weight small{font-size:.3em;color:#fff}
.audience .timer{font-size:min(22vw,170px);font-weight:900;line-height:.9;font-variant-numeric:tabular-nums}
.audience .ondeck{font-size:min(6vw,34px);color:#cfe6d3;margin-top:14px}
.audience .ondeck b{color:#fff}
.audience .closebtn{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.12);color:#fff;
  border:none;border-radius:10px;padding:10px 16px;font-weight:800;font-size:14px;cursor:pointer}
.timer.warn{color:var(--gold);animation:pulse .5s infinite alternate}
.timer.crit{color:var(--bad);animation:pulse .3s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}

/* referee lights */
.reflights{display:flex;gap:10px;justify-content:center;margin:10px 0}
.reflight{width:60px;height:60px;border-radius:12px;border:3px solid var(--line);background:var(--card2);
  cursor:pointer;transition:.15s;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted)}
.reflight.white{background:#f5f7f6;color:#333;border-color:#fff}
.reflight.red{background:var(--bad);color:#fff;border-color:var(--bad)}

.learn-card{border-inline-start:4px solid var(--gold)}
.timeline-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.timeline-item .t{flex:0 0 64px;font-weight:900;color:var(--gold);font-size:13px}
.quiz-opt{display:block;width:100%;text-align:right;background:var(--card2);border:1px solid var(--line);
  color:var(--txt);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;font-size:14px;font-weight:600}
.quiz-opt.correct{background:var(--good);color:#04240f;border-color:var(--good)}
.quiz-opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
details{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
summary{font-weight:800;cursor:pointer}
.kbd{font-size:11px;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
</style>
</head>
<body>

<!-- ====== EDIT DATA HERE ONLY — נתונים לעריכה בלבד ====== -->
<script id="DATA">
/* ניתן לשנות כאן שם התחרות, תאריך, וקישור טופס ההרשמה בלי לגעת בלוגיקה */
window.APP_DEFAULTS = {
  competitionName: "תחרות הרמת משקולות · CrossFit BUX",
  competitionDate: "2026-10-16",
  formUrl: ""   // קישור לטופס ההרשמה במאנדיי — יוזן כאן או דרך הגדרות באפליקציה
};
</script>
<!-- ====== END EDIT ====== -->

<header>
  <div class="brand">
    <div class="logo">BUX</div>
    <div>
      <h1 id="hTitle">תחרות הרמת משקולות</h1>
      <div class="sub">CrossFit BUX · <span class="num" id="hDate">16.10.2026</span></div>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="manage">🏋️ ניהול תחרות</button>
    <button class="tab" data-tab="calc">🧮 מחשבון סינקלייר</button>
    <button class="tab" data-tab="learn">📖 לימוד וחוקים</button>
    <button class="tab" data-tab="settings">⚙️ הגדרות</button>
  </nav>
</header>

<main>
  <section id="tab-manage"></section>
  <section id="tab-calc" style="display:none"></section>
  <section id="tab-learn" style="display:none"></section>
  <section id="tab-settings" style="display:none"></section>
</main>

<!-- audience full-screen -->
<div class="audience" id="audience">
  <button class="closebtn" onclick="closeAudience()">✕ סגור תצוגת קהל</button>
  <p class="lift-name" id="aName">—</p>
  <p class="lift-sub" id="aSub"></p>
  <div class="weight" id="aWeight">—<small> ק"ג</small></div>
  <div class="timer" id="aTimer">1:00</div>
  <div class="ondeck" id="aDeck"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   נתונים ואחסון (localStorage)
   ============================================================ */
const LS_KEY = 'buxWL_v1';
const D = window.APP_DEFAULTS;

let state = load() || {
  competitionName: D.competitionName,
  competitionDate: D.competitionDate,
  formUrl: D.formUrl,
  useCollars: true,
  athletes: [],
  step: 1,        // 1 register, 2 weigh, 3 flow, 4 results
  flowSession: null,
  flowPhase: 'snatch'
};

function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ return null; } }
function uid(){ return 'a'+Math.random().toString(36).slice(2,9); }

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============================================================
   1) מקדם סינקלייר (Sinclair Coefficient) — מחזור 2021–2024
   ============================================================ */
const SINCLAIR = {
  M:{A:0.722762521, b:193.609},
  F:{A:0.787004341, b:153.757}
};
// מחזיר {coeff, score} ; אם משקל גוף >= b המקדם = 1.0
function sinclair(sex, bodyweight, total){
  const p = SINCLAIR[sex]; if(!p || !bodyweight || bodyweight<=0) return {coeff:0,score:0};
  let coeff = bodyweight >= p.b ? 1.0
            : Math.pow(10, p.A * Math.pow(Math.log10(bodyweight/p.b), 2));
  return { coeff, score: (total||0) * coeff };
}

/* ============================================================
   2) שיבוץ קטגוריית משקל (Bodyweight Category) — תקן IWF מ-1.6.2025
   ============================================================ */
const CATS = {
  M_senior:[60,65,71,79,88,94,110],   // + מעל 110
  F_senior:[48,53,58,63,69,77,86],    // + מעל 86
  M_youth:[56,60,65,71,79,88,94],     // + מעל 94
  F_youth:[44,48,53,58,63,69,77]      // + מעל 77
};
// שיבוץ: הקטגוריה הקטנה ביותר שגדולה/שווה למשקל הגוף. 79.00→79 ; 79.01→88
function assignCategory(sex, bw, useYouth){
  if(!bw) return '';
  const key = sex+'_'+(useYouth?'youth':'senior');
  const arr = CATS[key];
  for(const c of arr){ if(bw <= c) return String(c); }
  return '+'+arr[arr.length-1];
}

/* ============================================================
   3) קבוצות גיל (Age Groups) — לפי שנת לידה (שנה קלנדרית)
   ============================================================ */
function compYear(){ return new Date(state.competitionDate+'T00:00:00').getFullYear() || 2026; }
function ageGroups(birthYear){
  if(!birthYear) return [];
  const age = compYear() - birthYear;
  const g=[];
  if(age>=13 && age<=17) g.push('נוער (Youth)');
  if(age>=15 && age<=20) g.push('נוער-בוגר (Junior)');
  if(age>=15) g.push('בוגרים (Senior)');
  if(age>=35) g.push('מאסטרס (Masters)');
  return g;
}
function isYouthAge(birthYear){
  if(!birthYear) return false;
  const age = compYear()-birthYear; return age>=13 && age<=17;
}

/* ============================================================
   לוגיקת כניסות (Attempts) + סדר עלייה למוט (Lifting Order)
   ============================================================ */
function blankLift(open){ return [
  {weight: open||0, result:null, changes:0},
  {weight:0, result:null, changes:0},
  {weight:0, result:null, changes:0}
];}
// הכניסה הפעילה של ספורטאי בתרגיל נתון: הראשונה שעדיין לא הוכרעה
function currentAttemptIndex(lifts){
  for(let i=0;i<3;i++){ if(lifts[i].result===null) return i; }
  return -1; // סיים 3 כניסות
}
function bestLift(lifts){
  let best=0; lifts.forEach(l=>{ if(l.result==='good' && l.weight>best) best=l.weight; });
  return best;
}
function isBombOut(lifts){ // נפסל בכל 3 הכניסות
  return lifts.every(l=>l.result==='no') || (lifts.filter(l=>l.result!==null).length===3 && bestLift(lifts)===0);
}

// מחשב את סדר העלייה למוט למקצה ולתרגיל.
// כללים (תקן IWF): משקל עולה ולא יורד → משקל מבוקש נמוך ראשון →
// שוויון: מספר כניסה נמוך → שוויון: מספר גורל (Lot) נמוך.
function liftingOrder(sessionAthletes, phase){
  const queue = sessionAthletes
    .filter(a => a.bodyweight)                     // חייב משקל גוף
    .map(a=>{
      const lifts = a[phase];
      const idx = currentAttemptIndex(lifts);
      if(idx<0 || !lifts[idx].weight) return null; // סיים / אין משקל מוכרז
      return { athlete:a, attemptIdx:idx, weight:lifts[idx].weight, lot:a.lot||9999 };
    })
    .filter(Boolean);
  queue.sort((x,y)=>
    x.weight - y.weight ||
    x.attemptIdx - y.attemptIdx ||
    x.lot - y.lot
  );
  return queue;
}

/* ============================================================
   מחשבון עומס מוט (Barbell Loading)
   ============================================================ */
const PLATES = [ // {kg, color, txt}
  {kg:25,c:'#d33',t:'#fff'},{kg:20,c:'#2456c9',t:'#fff'},{kg:15,c:'#e8c010',t:'#222'},
  {kg:10,c:'#2f9e3f',t:'#fff'},{kg:5,c:'#eee',t:'#333'},
  {kg:2.5,c:'#d33',t:'#fff'},{kg:2,c:'#2456c9',t:'#fff'},{kg:1.5,c:'#e8c010',t:'#222'},
  {kg:1,c:'#2f9e3f',t:'#fff'},{kg:0.5,c:'#eee',t:'#333'}
];
function plateSize(kg){ // גובה/רוחב ויזואלי
  if(kg>=25) return [58,15]; if(kg>=20) return [56,14]; if(kg>=15) return [54,13];
  if(kg>=10) return [46,12]; if(kg>=5) return [40,11]; if(kg>=2.5) return [30,9];
  if(kg>=2) return [26,8]; if(kg>=1.5) return [24,8]; if(kg>=1) return [22,7]; return [18,6];
}
// מחזיר {perSide:[kg...], bar, err}
function loadBar(target, sex){
  const bar = sex==='F' ? 15 : 20;
  const collars = state.useCollars ? 5 : 0; // 2.5 לכל צד
  let remain = target - bar - collars;
  if(remain < 0) return {perSide:[], bar, collars, err:'המשקל נמוך מהמוט'+(collars?'+סוגרים':'')};
  let perSideKg = remain/2;
  const per=[]; let r=perSideKg;
  for(const p of PLATES){ while(r + 1e-9 >= p.kg){ per.push(p.kg); r-=p.kg; } }
  return {perSide:per, bar, collars, leftover:r, err: r>0.001 ? 'לא ניתן לדייק — שארית '+r.toFixed(2)+' ק"ג' : null};
}

/* ============================================================
   ניווט טאבים
   ============================================================ */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  ['manage','calc','learn','settings'].forEach(t=>{
    document.getElementById('tab-'+t).style.display = (t===b.dataset.tab)?'block':'none';
  });
  render();
});

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

/* ============================================================
   RENDER — ניהול תחרות
   ============================================================ */
function render(){
  document.getElementById('hTitle').textContent = state.competitionName;
  document.getElementById('hDate').textContent = fmtDate(state.competitionDate);
  renderManage(); renderCalc(); renderLearn(); renderSettings();
  save();
}
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}.${m}.${y}`; }

function renderManage(){
  const root=document.getElementById('tab-manage');
  const steps=[['1','רישום','Registration'],['2','שקילה','Weigh-in'],['3','מהלך התחרות','Competition'],['4','תוצאות','Results']];
  let h = `<div class="stepbar">`;
  steps.forEach(s=> h+=`<div class="step ${state.step==s[0]?'active':''}" onclick="setStep(${s[0]})"><b>${s[0]}</b>${s[1]}<div class="muted" style="font-size:10px">${s[2]}</div></div>`);
  h+=`</div><div id="stepBody"></div>`;
  root.innerHTML=h;
  const body=document.getElementById('stepBody');
  if(state.step==1) body.appendChild(stepRegister());
  else if(state.step==2) body.appendChild(stepWeigh());
  else if(state.step==3) body.appendChild(stepFlow());
  else body.appendChild(stepResults());
}
function setStep(n){ state.step=n; render(); }

/* ---------- STEP 1: Registration ---------- */
function stepRegister(){
  const wrap=el('<div></div>');
  wrap.appendChild(el(`<div class="card">
    <h2>➕ הוספת ספורטאי/ת</h2>
    <div class="grid g3">
      <div><label>שם מלא</label><input id="r_name" placeholder="שם מלא"></div>
      <div><label>מין</label><select id="r_sex"><option value="M">גבר (Male)</option><option value="F">אישה (Female)</option></select></div>
      <div><label>שנת לידה</label><input id="r_by" type="number" placeholder="1995" inputmode="numeric"></div>
      <div><label>מועדון / קבוצה</label><input id="r_club" placeholder="CrossFit BUX"></div>
      <div><label>ותק קרוספיט (שנים)</label><input id="r_cf" type="number" step="0.5" placeholder="0"></div>
      <div><label>ותק הרמת משקולות (שנים)</label><input id="r_wl" type="number" step="0.5" placeholder="0"></div>
      <div><label>התחרה בעבר?</label><select id="r_prev"><option value="לא">לא</option><option value="כן">כן</option></select></div>

function drawLots(){

  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }

function autoSessions(){

/* ---------- STEP 3: Competition flow ---------- */
function stepFlow(){
  const wrap=el('<div></div>');
  const weighed=state.athletes.filter(a=>a.bodyweight);
  if(!weighed.length){ wrap.appendChild(el('<div class="empty">אין ספורטאים שנשקלו — חזור לשקילה</div>')); return wrap; }

      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div>
          <div class="muted">על הבמה עכשיו (Current)</div>
          <div style="font-size:26px;font-weight:900">${esc(a.name)}</div>
          <div class="muted">כניסה <b class="num">${cur.attemptIdx+1}</b> מתוך 3 · ${state.flowPhase==='snatch'?'הנפה':'הרחה ודחיקה'} · Lot <span class="num">${a.lot||'—'}</span></div>
        </div>
        <div style="text-align:center">
          <div style="font-size:46px;font-weight:900;color:var(--gold);line-height:1"><span class="num">${cur.weight}</span></div>
          <div class="muted">ק"ג על המוט</div>
        </div>

      <div class="reflights" id="reflights">
        ${[0,1,2].map(i=>`<div class="reflight" data-i="${i}" onclick="toggleRef(${i})">שופט ${i+1}</div>`).join('')}
      </div>
      <div class="row" style="justify-content:center">
        <button class="btn g" onclick="decide('${a.id}',true)">✓ הרמה תקינה (Good Lift)</button>
        <button class="btn danger" onclick="decide('${a.id}',false)">✗ פסולה (No Lift)</button>
      </div>
      <hr>
      <div class="row">
        <label style="margin:0">שינוי משקל הכניסה:</label>
        <input type="number" id="chgW" style="width:90px" value="${cur.weight}">
        <button class="btn sm" onclick="changeWeight('${a.id}')">עדכן</button>
        <span class="tag">שינויים שנוצלו: <b class="num">${a[state.flowPhase][cur.attemptIdx].changes}</b>/2</span>
      </div>
      <div class="muted" style="margin-top:6px">הבא בתור (On Deck): <b>${deck?esc(deck.athlete.name)+' · '+deck.weight+' ק"ג':'—'}</b>${hole?` | ואחריו: ${esc(hole.athlete.name)} · ${hole.weight} ק"ג`:''}</div>

  let t=`<table><thead><tr><th>Lot</th><th>שם</th><th>הנפה 1</th><th>הנפה 2</th><th>הנפה 3</th><th>ה"ד 1</th><th>ה"ד 2</th><th>ה"ד 3</th><th>מקצה</th></tr></thead><tbody>`;

function cellAtt(a,lift,i,isCur){
  const l=a[lift][i];
  const cls = l.result==='good'?'good':l.result==='no'?'no':'';
  const activeIdx=currentAttemptIndex(a[lift]);
  const cur = isCur && lift===state.flowPhase && i===activeIdx ? 'cur':'';
  const txt = l.result==='good'?l.weight:l.result==='no'?l.weight:(l.weight||'·');
  return `<td><span class="att ${cls} ${cur}">${txt}</span></td>`;
}
function setSession(s){ state.flowSession=s; render(); }
function setPhase(p){ state.flowPhase=p; render(); }

// שינוי משקל כניסה — אוכף חוקים
function changeWeight(id){
  const a=find(id); const idx=currentAttemptIndex(a[state.flowPhase]);
  if(idx<0){ toast('הספורטאי סיים 3 כניסות'); return; }
  const att=a[state.flowPhase][idx];
  const nv=parseFloat(document.getElementById('chgW').value);
  if(!nv){ toast('משקל לא תקין'); return; }
  // לא נמוך ממשקל שכבר הוכרז / מכניסה מוצלחת קודמת
  const minAllowed=minNextWeight(a,state.flowPhase,idx);
  if(nv < minAllowed){ toast('אסור מתחת ל-'+minAllowed+' ק"ג'); return; }
  if(nv!==att.weight && att.changes>=2){ toast('נוצלו 2 שינויי הצהרה — חסום'); return; }
  if(nv!==att.weight) att.changes++;
  att.weight=nv; toast('עודכן ל-'+nv+' ק"ג'); render();
}
// המשקל המינימלי המותר לכניסה: לפחות מקסימום הכניסות הקודמות +1 אם היו מוצלחות, לפחות מוט
function minNextWeight(a,lift,idx){
  let m=0;
  for(let i=0;i<idx;i++){ const l=a[lift][i]; if(l.result==='good') m=Math.max(m,l.weight+1); else m=Math.max(m,l.weight); }
  return Math.max(m, a.sex==='F'?15:20);
}

// החלטת שופט
let refState=[null,null,null];
function toggleRef(i){
  const cell=document.querySelector(`.reflight[data-i="${i}"]`);
  refState[i]= refState[i]==='white'?'red': refState[i]==='red'?null:'white';
  cell.className='reflight '+(refState[i]||'');
  cell.textContent = refState[i]==='white'?'לבן ✓': refState[i]==='red'?'אדום ✗':'שופט '+(i+1);
}
function decide(id, good){
  // אם שופטים סומנו — רוב קובע; אחרת הכפתור קובע
  const votes=refState.filter(Boolean);
  let result;
  if(votes.length===3){ const whites=refState.filter(r=>r==='white').length; result=whites>=2?'good':'no'; }
  else result=good?'good':'no';
  const a=find(id); const idx=currentAttemptIndex(a[state.flowPhase]);
  if(idx<0) return;
  const att=a[state.flowPhase][idx];
  att.result=result;
  // אחרי הצלחה — הצע +1 אוטומטי לכניסה הבאה
  if(idx<2){ const next=a[state.flowPhase][idx+1];
    const min=minNextWeight(a,state.flowPhase,idx+1);
    if(next.weight < min) next.weight=min;
  }
  refState=[null,null,null];
  stopTimer();
  toast(result==='good'?'✓ הרמה תקינה':'✗ פסולה'); render();
}

/* ---------- Timer ---------- */
let timer={remaining:60, running:false, iv:null};
function renderTimer(){
  const box=document.getElementById('timerBox'); if(!box) return;
  const m=Math.floor(timer.remaining/60), s=timer.remaining%60;
  const cls = timer.remaining<=10?'crit':timer.remaining<=30?'warn':'';
  box.innerHTML=`<div class="row" style="justify-content:center;align-items:center;margin:8px 0">
    <div class="timer ${cls}" style="font-size:52px" id="tDisp"><span class="num">${m}:${String(s).padStart(2,'0')}</span></div>
  </div>
  <div class="row" style="justify-content:center">
    <button class="btn" onclick="startTimer(60)">▶ 60 שנ׳</button>
    <button class="btn ghost" onclick="startTimer(120)">▶ 120 שנ׳</button>
    <button class="btn ghost" onclick="stopTimer()">⏸ עצור</button>
    <button class="btn ghost" onclick="resetTimer(60)">↺ אפס</button>
  </div>`;
  syncAudienceTimer();
}
function startTimer(sec){
  if(sec) timer.remaining=sec;
  if(timer.running) return;
  timer.running=true;
  timer.iv=setInterval(()=>{
    timer.remaining--;
    if(timer.remaining===30) beep(2); if(timer.remaining===10) beep(3);
    if(timer.remaining<=0){ timer.remaining=0; stopTimer(); beep(5); }
    updateTimerDisp();
  },1000);
  updateTimerDisp();
}
function stopTimer(){ timer.running=false; clearInterval(timer.iv); }
function resetTimer(sec){ stopTimer(); timer.remaining=sec; updateTimerDisp(); }
function updateTimerDisp(){
  const m=Math.floor(timer.remaining/60), s=timer.remaining%60;
  const txt=`${m}:${String(s).padStart(2,'0')}`;
  const cls=timer.remaining<=10?'crit':timer.remaining<=30?'warn':'';
  const d=document.getElementById('tDisp'); if(d){ d.innerHTML=`<span class="num">${txt}</span>`; d.className='timer '+cls; }
  syncAudienceTimer();
}
function beep(n){
  try{ const ac=new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<n;i++){ const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);o.frequency.value=880;
      g.gain.setValueAtTime(.0001,ac.currentTime+i*.15);
      g.gain.exponentialRampToValueAtTime(.3,ac.currentTime+i*.15+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+i*.15+.12);
      o.start(ac.currentTime+i*.15);o.stop(ac.currentTime+i*.15+.13); }
  }catch(e){}
}

/* ---------- Barbell visual ---------- */
function barbellHTML(target,sex){
  const {perSide,bar,collars,err}=loadBar(target,sex);
  let plates='';
  perSide.forEach(kg=>{ const p=PLATES.find(x=>x.kg===kg); const [h,w]=plateSize(kg);
    plates+=`<div class="plate" style="height:${h}px;width:${w}px;background:${p.c};color:${p.t}">${kg}</div>`; });
  const mirror = perSide.slice().reverse().map(kg=>{ const p=PLATES.find(x=>x.kg===kg); const [h,w]=plateSize(kg);
    return `<div class="plate" style="height:${h}px;width:${w}px;background:${p.c};color:${p.t}">${kg}</div>`; }).join('');
  return `<div style="margin:6px 0">
    <div class="muted" style="text-align:center">מוט ${bar} ק"ג ${collars?'+ סוגרים 2.5×2':'(ללא סוגרים)'} · העמסה לכל צד: ${perSide.length?perSide.join('+')+' ק"ג':'—'}${err?` <span style="color:var(--bad)">(${err})</span>`:''}</div>
    <div class="bar-wrap">
      <div class="sleeve"></div>${mirror}${collars?'<div class="collar"></div>':''}
      <div class="barcenter"></div>
      ${collars?'<div class="collar"></div>':''}${plates}<div class="sleeve"></div>
    </div>
  </div>`;
}

/* ---------- Audience mode ---------- */
function openAudience(){ document.getElementById('audience').classList.add('on'); updateAudience(); }
function closeAudience(){ document.getElementById('audience').classList.remove('on'); }
function updateAudience(){
  const weighed=state.athletes.filter(a=>a.bodyweight && (a.session||1)==state.flowSession);
  const order=liftingOrder(weighed, state.flowPhase);
  const cur=order[0], deck=order[1];
  document.getElementById('aName').textContent = cur?cur.athlete.name:'—';
  document.getElementById('aSub').textContent = cur?`כניסה ${cur.attemptIdx+1}/3 · ${state.flowPhase==='snatch'?'הנפה (Snatch)':'הרחה ודחיקה (C&J)'}`:'';
  document.getElementById('aWeight').innerHTML = cur?`<span class="num">${cur.weight}</span><small> ק"ג</small>`:'—';
  document.getElementById('aDeck').innerHTML = deck?`הבא בתור: <b>${esc(deck.athlete.name)}</b> · <span class="num">${deck.weight}</span> ק"ג`:'';
  syncAudienceTimer();
}
function syncAudienceTimer(){
  const at=document.getElementById('aTimer'); if(!at) return;
  const m=Math.floor(timer.remaining/60), s=timer.remaining%60;
  at.innerHTML=`<span class="num">${m}:${String(s).padStart(2,'0')}</span>`;
  at.className='timer '+(timer.remaining<=10?'crit':timer.remaining<=30?'warn':'');
}

/* ---------- STEP 4: Results ---------- */
function stepResults(){
  const wrap=el('<div></div>');
  wrap.appendChild(el(`<div class="card"><h2>🏆 תוצאות ומיקומים</h2>
    <p class="muted">מקצה (Total) = הנפה טובה + הרחה ודחיקה טובה. שובר שוויון: מי שהשיג את המקצה קודם (תקן IWF עדכני).</p>
    <div class="row">
      <button class="btn" onclick="exportCSV()">📄 ייצוא CSV</button>
      <button class="btn ghost" onclick="exportJSON()">💾 גיבוי JSON</button>
      <button class="btn ghost" onclick="window.print()">🖨️ הדפסה</button>
    </div>
  </div>`));

  const weighed=state.athletes.filter(a=>a.bodyweight);
  if(!weighed.length){ wrap.appendChild(el('<div class="empty">אין תוצאות עדיין</div>')); return wrap; }

  // group by sex+category
  const groups={};
  weighed.forEach(a=>{ const k=(a.sex==='M'?'גברים':'נשים')+' · '+a.category+' ק"ג'; (groups[k]=groups[k]||[]).push(a); });
  Object.keys(groups).sort().forEach(k=>{
    const list=rankGroup(groups[k]);
    const card=el(`<div class="card"><h3>${k}</h3></div>`);
    card.appendChild(resultsTable(list));
    wrap.appendChild(card);
  });

  // Best Lifter (Sinclair) — separate M/F
  ['M','F'].forEach(sex=>{
    const list=weighed.filter(a=>a.sex===sex).map(a=>{
      const total=totalOf(a); const s=sinclair(sex,a.bodyweight,total);
      return {a,total,coeff:s.coeff,score:s.score};
    }).filter(x=>x.total>0).sort((x,y)=>y.score-x.score);
    if(!list.length) return;
    const card=el(`<div class="card"><h3>🥇 המרים/ה הטוב/ה ביותר (Best Lifter · Sinclair) — ${sex==='M'?'גברים':'נשים'}</h3></div>`);
    const sc=el('<div class="scroll"></div>');
    let t=`<table><thead><tr><th>#</th><th>שם</th><th>משקל גוף</th><th>מקצה</th><th>מקדם</th><th>סינקלייר</th></tr></thead><tbody>`;
    list.forEach((x,i)=>t+=`<tr><td><b>${i+1}</b></td><td style="text-align:right">${esc(x.a.name)}</td>
      <td class="num">${x.a.bodyweight}</td><td class="num">${x.total}</td>
      <td class="num">${x.coeff.toFixed(4)}</td><td><b class="num">${x.score.toFixed(3)}</b></td></tr>`);
    t+='</tbody></table>'; sc.innerHTML=t; card.appendChild(sc); wrap.appendChild(card);
  });

  return wrap;
}
function totalOf(a){ const sn=bestLift(a.snatch), cj=bestLift(a.cj); return (sn&&cj)?sn+cj:0; }
function rankGroup(list){
  return list.map(a=>({a,total:totalOf(a),bomb:totalOf(a)===0}))
    .sort((x,y)=> (x.bomb-y.bomb) || (y.total-x.total) || 0); // מנפחים בתחתית
}
function resultsTable(ranked){
  const sc=el('<div class="scroll"></div>');
  let t=`<table><thead><tr><th>#</th><th>שם</th><th>משקל גוף</th><th>הנפה</th><th>ה"ד</th><th>מקצה</th><th>סינקלייר</th></tr></thead><tbody>`;
  ranked.forEach((x,i)=>{
    const a=x.a; const s=sinclair(a.sex,a.bodyweight,x.total);
    t+=`<tr><td><b>${x.bomb?'—':i+1}</b></td><td style="text-align:right">${esc(a.name)}${x.bomb?' <span class="tag">Bomb-out</span>':''}</td>
      <td class="num">${a.bodyweight||'—'}</td>
      <td class="num">${bestLift(a.snatch)||'—'}</td><td class="num">${bestLift(a.cj)||'—'}</td>
      <td><b class="num">${x.total||'—'}</b></td>
      <td class="num">${x.total?s.score.toFixed(3):'—'}</td></tr>`;
  });
  t+='</tbody></table>'; sc.innerHTML=t; return sc;
}

function catAndAge(sex,bw,by){
  const cat=bw?assignCategory(sex,bw,isYouthAge(by)):'';
  const groups=by?ageGroups(by):[];
  return {cat,groups};
}
function calcSinclair(){
  const sex=document.getElementById('c_sex').value;
  const bw=parseFloat(document.getElementById('c_bw').value);
  const by=parseInt(document.getElementById('c_by').value)||null;
  let total=parseFloat(document.getElementById('c_tot').value)||0;
  const sn=parseFloat(document.getElementById('c_sn').value)||0;
  const cj=parseFloat(document.getElementById('c_cj').value)||0;
  if(!total) total=sn+cj;
  if(!bw||!total){ document.getElementById('calcOut').innerHTML='<div class="muted">נא להזין משקל גוף ומקצה (או הנפה+ה"ד)</div>'; return; }
  const s=sinclair(sex,bw,total);
  const {cat,groups}=catAndAge(sex,bw,by);
  document.getElementById('calcOut').innerHTML=`
    <div class="card" style="background:var(--card2);margin:0">
      <div class="row" style="justify-content:space-between">
        <div><div class="muted">תוצאת סינקלייר</div><div style="font-size:38px;font-weight:900;color:var(--gold)"><span class="num">${s.score.toFixed(3)}</span></div></div>
        <div style="text-align:left"><div class="muted">מקדם · מקצה</div><div class="num" style="font-size:16px">${s.coeff.toFixed(4)} × ${total}</div></div>
      </div>
      <hr>
      <div class="row">${cat?`<span class="pill gold num">קטגוריה ${cat} ק"ג</span>`:''}${groups.map(g=>`<span class="pill age">${g}</span>`).join('')}</div>
    </div>`;
}
let cmpN=0;
function addCmp(){
  if(cmpN>=4){ toast('עד 4 מרימים'); return; }
  cmpN++;
  const row=el(`<div class="grid g3" style="margin-bottom:8px" data-cmp>
    <div><input placeholder="שם" class="cmp_name"></div>
    <div><select class="cmp_sex"><option value="M">גבר</option><option value="F">אישה</option></select></div>
    <div class="row" style="gap:4px"><input placeholder='משקל' type="number" step="0.01" class="cmp_bw" style="flex:1"><input placeholder='מקצה' type="number" class="cmp_tot" style="flex:1"></div>
  </div>`);
  document.getElementById('cmpRows').appendChild(row);
}
function calcCmp(){
  const rows=[...document.querySelectorAll('#cmpRows [data-cmp]')];
  const data=rows.map(r=>{
    const name=r.querySelector('.cmp_name').value||'—';
    const sex=r.querySelector('.cmp_sex').value;
    const bw=parseFloat(r.querySelector('.cmp_bw').value);
    const tot=parseFloat(r.querySelector('.cmp_tot').value);
    if(!bw||!tot) return null;
    const s=sinclair(sex,bw,tot); return {name,sex,bw,tot,coeff:s.coeff,score:s.score};
  }).filter(Boolean).sort((a,b)=>b.score-a.score);
  if(!data.length){ document.getElementById('cmpOut').innerHTML='<div class="muted">מלא משקל+מקצה לפחות למרים אחד</div>'; return; }
  let t=`<div class="scroll"><table><thead><tr><th>#</th><th>שם</th><th>מין</th><th>משקל</th><th>מקצה</th><th>מקדם</th><th>סינקלייר</th></tr></thead><tbody>`;
  data.forEach((x,i)=>t+=`<tr><td><b>${i+1}</b></td><td style="text-align:right">${esc(x.name)}</td><td><span class="pill ${x.sex==='M'?'m':'f'}">${x.sex}</span></td><td class="num">${x.bw}</td><td class="num">${x.tot}</td><td class="num">${x.coeff.toFixed(4)}</td><td><b class="num">${x.score.toFixed(3)}</b></td></tr>`);
  t+='</tbody></table></div>';
  document.getElementById('cmpOut').innerHTML=t;
}

   o:['79','88'],c:1,e:'79.01 גדול מ-79 → משובץ ל-88.'},

];
let quizI=0, quizScore=0, quizCount=0, quizAnswered=false;
function resetQuiz(){ quizI=0;quizScore=0;quizCount=0;quizAnswered=false; renderQuiz(); }
function nextQuiz(){ quizI=(quizI+1)%QUIZ.length; quizAnswered=false; renderQuiz(); }
function renderQuiz(){
  const box=document.getElementById('quizBox'); if(!box) return;
  const q=QUIZ[quizI];
  document.getElementById('quizScore').textContent=`${quizScore}/${quizCount}`;
  box.innerHTML=`<div style="font-weight:800;margin-bottom:10px">${q.q}</div>`+
    q.o.map((op,i)=>`<button class="quiz-opt" data-i="${i}" onclick="answerQuiz(${i})">${op}</button>`).join('')+
    `<div id="quizFb" class="muted" style="margin-top:6px"></div>`;
}
function answerQuiz(i){
  if(quizAnswered) return; quizAnswered=true;
  const q=QUIZ[quizI]; quizCount++;
  document.querySelectorAll('#quizBox .quiz-opt').forEach(b=>{
    const bi=+b.dataset.i;
    if(bi===q.c) b.classList.add('correct');
    else if(bi===i) b.classList.add('wrong');
  });
  if(i===q.c) quizScore++;
  document.getElementById('quizFb').innerHTML=(i===q.c?'✅ נכון! ':'❌ ')+q.e;
  document.getElementById('quizScore').textContent=`${quizScore}/${quizCount}`;
}

function importJSON(e){

    if(!d.athletes) throw 0; state=d; save();

/* ---------- CSV import (סלחני) ---------- */
function importCSV(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ parseCSV(r.result); };
  r.readAsText(f,'UTF-8');
}
function parseCSV(text){
  const rows=csvRows(text);
  if(rows.length<2){ toast('CSV ריק'); return; }
  const headers=rows[0].map(h=>h.trim());
  // מיפוי גמיש לפי מילות מפתח
  const col=(...keys)=>{ for(let i=0;i<headers.length;i++){ const h=headers[i]; if(keys.some(k=>h.includes(k))) return i; } return -1; };
  const iName=col('שם'); const iSex=col('מין'); const iBirth=col('לידה'); const iClub=col('מועדון','קבוצה');
  const iCF=col('קרוספיט'); const iWL=col('הרמת משקולות','ותק בהרמת'); const iPrev=col('התחר','בעבר');
  const iOS=col('פתיחה הנפה','פתיחה — הנפה','פתיחה  הנפה'); const iOC=col('פתיחה הרחה','פתיחה — הרחה','דחיקה');
  const iBW=col('משוער','משקל גוף');
  if(iName<0){ toast('לא נמצאה עמודת "שם"'); return; }
  let added=0, skipped=0;
  for(let ri=1;ri<rows.length;ri++){
    const row=rows[ri]; if(!row || !row.join('').trim()) continue;
    const name=(row[iName]||'').trim(); if(!name){ skipped++; continue; }
    const sexRaw=(iSex>=0?row[iSex]:'')||'';
    const sex=/נק|אישה|female|f|בת/i.test(sexRaw)?'F':'M';
    const by=parseBirthYear(iBirth>=0?row[iBirth]:'');
    state.athletes.push({
      id:uid(), name, sex, birthYear:by,
      club:(iClub>=0?row[iClub]:'')||'',
      crossfitExp:parseFloat(iCF>=0?row[iCF]:'')||0, wlExp:parseFloat(iWL>=0?row[iWL]:'')||0,
      competedBefore:(iPrev>=0?row[iPrev]:'')||'',
      estBW:parseFloat(iBW>=0?row[iBW]:'')||null,
      bodyweight:null, category:'', session:1, lot:null,
      snatch: blankLift(parseFloat(iOS>=0?row[iOS]:'')||0),
      cj: blankLift(parseFloat(iOC>=0?row[iOC]:'')||0)
    });
    added++;
  }
  toast(`יובאו ${added} ספורטאים${skipped?` (${skipped} דולגו)`:''}`);
  render();
}
function parseBirthYear(v){
  if(!v) return null; const s=String(v);
  const m=s.match(/(19|20)\d{2}/); return m?parseInt(m[0]):null;
}
// CSV parser תומך בפסיקים בתוך מרכאות
function csvRows(text){
  text=text.replace(/^﻿/,''); const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else{ if(c==='"') q=true; else if(c===','){row.push(cell);cell='';}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
      else if(c==='\r'){} else cell+=c; }
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows;
}

/* ---------- CSV export ---------- */
function exportCSV(){
  const weighed=state.athletes.filter(a=>a.bodyweight);
  const rows=[['מיקום','שם','מין','קטגוריה','משקל גוף','קבוצות גיל','הנפה','הרחה ודחיקה','מקצה','מקדם סינקלייר','תוצאת סינקלייר']];
  const groups={};
  weighed.forEach(a=>{ const k=(a.sex==='M'?'גברים':'נשים')+'|'+a.category; (groups[k]=groups[k]||[]).push(a); });
  Object.keys(groups).sort().forEach(k=>{
    rankGroup(groups[k]).forEach((x,i)=>{ const a=x.a; const s=sinclair(a.sex,a.bodyweight,x.total);
      rows.push([x.bomb?'-':i+1, a.name, a.sex==='M'?'גבר':'אישה', a.category, a.bodyweight,
        ageGroups(a.birthYear).join(' / '), bestLift(a.snatch)||0, bestLift(a.cj)||0, x.total||0,
        x.total?s.coeff.toFixed(4):0, x.total?s.score.toFixed(3):0]);
    });
  });
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  download(new Blob([csv],{type:'text/csv'}),`bux-wl-results-${state.competitionDate}.csv`);
  toast('תוצאות CSV הורדו');
}
function download(blob,name){
  const u=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
}

/* ============================================================
   בדיקות (Console Assertions)
   ============================================================ */
function runTests(){
  let pass=0, fail=0;
  const ok=(cond,msg)=>{ if(cond){pass++;} else {fail++; console.error('❌ FAIL:',msg);} };
  const near=(a,b,eps=0.01)=>Math.abs(a-b)<=eps;

  // סינקלייר — גבר 81 ק"ג, מקצה 300
  const m=sinclair('M',81,300);
  ok(m.coeff>1 && m.coeff<1.3, 'מקדם גבר 81 ק"ג בטווח סביר, קיבלנו '+m.coeff.toFixed(4));
  ok(near(m.score, 300*m.coeff), 'score = total × coeff (M)');
  // אישה 63 ק"ג, מקצה 200
  const w=sinclair('F',63,200);
  ok(w.coeff>1 && w.coeff<1.6, 'מקדם אישה 63 ק"ג בטווח סביר, קיבלנו '+w.coeff.toFixed(4));
  ok(near(w.score, 200*w.coeff), 'score = total × coeff (F)');
  // מעל b → מקדם 1.0
  ok(sinclair('M',200,300).coeff===1.0, 'משקל מעל b → מקדם 1.0 (M)');
  ok(sinclair('F',160,200).coeff===1.0, 'משקל מעל b → מקדם 1.0 (F)');

  // שיבוץ קטגוריות — גבולות
  ok(assignCategory('M',79.00,false)==='79', '79.00 → קטגוריה 79');
  ok(assignCategory('M',79.01,false)==='88', '79.01 → קטגוריה 88');
  ok(assignCategory('M',200,false)==='+110', 'מעל 110 → +110');
  ok(assignCategory('F',48.00,false)==='48', 'אישה 48.00 → 48');
  ok(assignCategory('F',48.01,false)==='53', 'אישה 48.01 → 53');
  ok(assignCategory('M',55,true)==='56', 'נער 55 → 56 (Youth)');

  // סדר עלייה למוט
  const mk=(name,lot,w,idx)=>{ const a={id:name,name,sex:'M',bodyweight:80,lot,session:1,
    snatch:[{weight:0,result:'good',changes:0},{weight:0,result:'good',changes:0},{weight:0,result:null,changes:0}],cj:blankLift(0)};
    // נכוון את הכניסה הפעילה (idx) למשקל w
    a.snatch=[{weight:70,result:'good',changes:0},{weight:75,result:'good',changes:0},{weight:0,result:null,changes:0}];
    a.snatch[2].weight=w; a._forceIdx=idx; return a; };
  // מקרה: משקל נמוך עולה ראשון
  let A={name:'A',sex:'M',bodyweight:80,lot:3,session:1,snatch:blankLift(100),cj:blankLift(0)};
  let B={name:'B',sex:'M',bodyweight:80,lot:1,session:1,snatch:blankLift(95),cj:blankLift(0)};
  let ord=liftingOrder([A,B],'snatch');
  ok(ord[0].athlete.name==='B', 'משקל נמוך (95) עולה לפני 100');
  // שוויון משקל → כניסה נמוכה קודמת
  let C={name:'C',sex:'M',bodyweight:80,lot:5,session:1,snatch:[{weight:100,result:null,changes:0},{weight:0,result:null,changes:0},{weight:0,result:null,changes:0}],cj:blankLift(0)};
  let Dd={name:'D',sex:'M',bodyweight:80,lot:2,session:1,snatch:[{weight:90,result:'good',changes:0},{weight:100,result:null,changes:0},{weight:0,result:null,changes:0}],cj:blankLift(0)};
  ord=liftingOrder([C,Dd],'snatch');
  ok(ord[0].athlete.name==='C','שוויון 100: כניסה 1 (C) לפני כניסה 2 (D)');
  // שוויון משקל+כניסה → lot נמוך
  let E={name:'E',sex:'M',bodyweight:80,lot:7,session:1,snatch:blankLift(100),cj:blankLift(0)};
  let F={name:'F',sex:'M',bodyweight:80,lot:4,session:1,snatch:blankLift(100),cj:blankLift(0)};
  ord=liftingOrder([E,F],'snatch');
  ok(ord[0].athlete.name==='F','שוויון מלא: lot נמוך (4) קודם');

  // best lift & bomb-out
  ok(bestLift([{weight:100,result:'good'},{weight:105,result:'no'},{weight:105,result:'good'}])===105,'bestLift=105');
  ok(isBombOut([{weight:100,result:'no'},{weight:100,result:'no'},{weight:100,result:'no'}])===true,'bomb-out זוהה');

  // barbell loading
  const bl=loadBar(100,'M'); // 100-20-5=75 → 37.5 לצד
  ok(near(bl.perSide.reduce((s,x)=>s+x,0), 37.5), 'העמסת 100 ק"ג = 37.5 לכל צד, קיבלנו '+bl.perSide.join('+'));

  console.log(`%c🏋️ BUX WL Tests: ${pass} passed, ${fail} failed`, `color:${fail?'#ef4b4b':'#3ecf6b'};font-weight:bold`);
  console.log('דוגמאות סינקלייר: גבר 81/300 =',m.score.toFixed(3),'| אישה 63/200 =',w.score.toFixed(3));
}
